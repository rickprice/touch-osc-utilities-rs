[package]
name = "touch-osc-core"
description = "Lossless library for reading, writing and building TouchOSC (.tosc) layouts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["touchosc", "osc", "midi", "tosc"]
categories = ["encoding", "parser-implementations"]

[dependencies]
flate2 = "1"
full_moon = "3"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
